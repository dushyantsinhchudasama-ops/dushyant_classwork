<h2>Categories</h2>


<a routerLink="/add-category" class="btn btn-primary">Add new Category</a>
<br><br>
<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Category Name</th>
      <th>Description</th>
    </tr>
  </thead>

  <tbody>
    @for (category of categories; track category.categoryId) {
      <tr>
        <td>{{ category.categoryId }}</td>
        <td>{{ category.categoryName }}</td>
        <td>{{ category.description }}</td>
      </tr>
    }
  </tbody>
</table>
